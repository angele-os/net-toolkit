<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">
  <!-- Grain de papier : un bruit très léger (même réglage que le portfolio). Fichier séparé car la CSP interdit les images data:. -->
  <filter id="n">
    <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .08 0 0 0 0 .09 0 0 0 0 .1 0 0 0 .07 0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#n)"/>
</svg>
