name: Déploiement

# Publie le site sur GitHub Pages à chaque push sur main, ou à la main depuis l'onglet Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Par défaut, chaque job ne peut que LIRE le dépôt. Seul le job « deploy » reçoit plus de droits.
permissions:
  contents: read

# Un seul déploiement à la fois. Un déploiement en cours n'est pas annulé (cancel-in-progress: false) :
# on évite un site à moitié publié ; le suivant attend son tour.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1. Les tests doivent passer avant toute publication.
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Lancer les tests
        run: npm test

  # 2. Assemble le site : UNIQUEMENT les fichiers servis au navigateur (liste blanche).
  build:
    name: Construction de _site
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Copier les fichiers du site dans _site
        run: |
          mkdir _site
          cp index.html 404.html favicon.svg robots.txt sitemap.xml _site/
          cp -R css js fonts _site/

      - name: Lister les fichiers publiés
        run: find _site -type f | sort

      - name: Préparer l'archive pour GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # 3. Publie l'archive. Ne démarre que si « test » ET « build » ont réussi.
  deploy:
    name: Publication
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Vérifier la configuration de GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
